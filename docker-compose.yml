services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: powerloom
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes: [powerloom_db:/var/lib/postgresql/data]
  web:
    build: .
    ports: ['8000:8000']
    environment:
      DJANGO_DEBUG: '1'
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: powerloom
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: db
      DB_PORT: '5432'
    depends_on: [db]
volumes:
  powerloom_db:
